name: Verify research
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check guides, catalog and small exact examples
        run: python3 scripts/check_collection.py
      - name: Compile recovered solvers and replay small experiments only
        run: python3 computation/experiments/check.py
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [mathematics, cryptid]
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and Mathlib cache
        working-directory: ${{ matrix.package == 'cryptid' && 'cryptid' || '.' }}
        run: lake exe cache get
      - name: Build and audit
        working-directory: ${{ matrix.package == 'cryptid' && 'cryptid' || '.' }}
        run: |
          lake build
          if [ '${{ matrix.package }}' = 'cryptid' ]; then
            python3 ../scripts/check_axioms.py
          else
            python3 scripts/check_axioms.py
            python3 scripts/verify_export.py
            python3 computation/check_semantics.py
            lake env lean --run computation/CheckEarlier.lean
          fi
      - name: Retain verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-verification
          path: |
            verification/local/
            cryptid/verification/local/
